version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: fcg-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  fcg-api:
    build:
      context: .
      dockerfile: src/FCG.API/Dockerfile
    container_name: fcg-api
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DatabaseProvider=MongoDB
      - ConnectionStrings__DefaultConnection=mongodb://mongodb:27017
      - MongoDB__DatabaseName=FiapCloudGames
      - Jwt__Secret=FCG_SUPER_SECRET_KEY_CHANGE_IN_PRODUCTION_32CHARS!
      - Jwt__Issuer=FiapCloudGames
      - Jwt__Audience=FiapCloudGamesUsers
      - Jwt__ExpirationHours=8
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data:
